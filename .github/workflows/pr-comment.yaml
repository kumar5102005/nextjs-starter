name: pr comment
on:
  pull_request_target: 
    types: [opened]

jobs: 
  add-deployment-info-comment:
    runs-on: ubuntu-latest
    permissions: 
      actions: write
    steps:
      - name: add deployment info comment
        uses: actions/github-script@v6
        with: 
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.repo.issue_number,
              body: "/deploy - to deploy the env, /destroy - to destroy the created env",
            });
