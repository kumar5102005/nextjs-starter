name: pr comment
on:
  pull_request_target: 
    types: [opened]

jobs: 
  add-deployment-info-comment:
    runs-on: ubuntu-latest
    permissions: 
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: add deployment info comment
        uses: actions/github-script@v6
        with: 
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.pull_request?.number || context.issue.number;

            if (!issueNumber) {
              throw new Error("Could not find an issue or pull request number for this event context.");
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: "/deploy - to deploy the env, /destroy - to destroy the created env",
            });
